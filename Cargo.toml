[package]
name = "cower"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/al8n/cower"
documentation = "https://docs.rs/cower"
description = "Policy-based clone-on-write pointers for no_std, with or without alloc"
license = "MIT OR Apache-2.0"
rust-version = "1.87"
keywords = ["cow", "borrow", "no-std", "no-alloc"]
categories = ["no-std", "no-std::no-alloc"]
exclude = ["/.github/", "/ci/", "/.codecov.yml", "/deny.toml"]

# The tiers. With no feature the crate is `no_std` and allocates nothing; `alloc` adds the heap
# types and `std` the standard library, and the two are independent: `std` does not imply `alloc`.
# All four combinations are built and tested with and without `heapless`. The optional
# `heapless` feature enables only the dependency; its inline storage needs neither tier.
[features]
default = ["std"]
std = []
alloc = []
heapless = ["dep:heapless"]

[dependencies]
heapless = { version = "0.9.3", optional = true, default-features = false }

[dev-dependencies]
criterion = "0.8"
# Custom-policy tests and doctests also run with the built-in integration disabled.
heapless = { version = "0.9.3", default-features = false }

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[lib]
bench = false

[[example]]
name = "inline"
required-features = ["heapless"]

[[bench]]
path = "benches/cow.rs"
name = "cow"
harness = false

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
